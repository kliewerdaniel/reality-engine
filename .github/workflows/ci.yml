name: CI

on:
  push:
    branches: [main, hermes/cleanup-and-m1]
  pull_request:
    branches: [main]

jobs:
  # Zero-dependency check job
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check package installs
        run: |
          pip install -e .

      - name: Run tests
        run: |
          pytest -v

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src tests

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy src/reality_engine --strict

  # Doc link checker
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run link checker
        run: |
          python scripts/check_links.py

      - name: Run doc lint
        run: |
          python scripts/lint_docs.py
